<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FPK O'VILLAGE — Manager</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--p:#6C63FF;--g:#10B981;--r:#EF4444;--a:#F59E0B;--b:#3B82F6;--bg:#F8F9FC;--w:#fff;--bd:#E5E7EB;--t:#111827;--t2:#6B7280;--t3:#9CA3AF;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:14px;}
nav{background:var(--w);border-bottom:1px solid var(--bd);padding:0 20px;display:flex;align-items:center;gap:12px;height:54px;position:sticky;top:0;z-index:200;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.logo{font-size:16px;font-weight:800;color:var(--t);flex:1;letter-spacing:-0.01em;}
.logo span{color:var(--p);}
.nbtn{padding:7px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:12px;}
.mav{width:34px;height:34px;border-radius:50%;background:#EEF0FF;border:2px solid #C7C5FF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:var(--p);}
.tabs{display:flex;background:var(--w);padding:0 20px;border-bottom:1px solid var(--bd);}
.tab{padding:11px 16px;border:none;background:transparent;color:var(--t2);cursor:pointer;font-weight:600;font-size:13px;border-bottom:3px solid transparent;}
.tab.active{color:var(--p);border-bottom-color:var(--p);}
.page{padding:18px;max-width:1040px;margin:0 auto;display:none;}
.page.active{display:block;}
.kg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px;}
.kb{background:var(--w);border:1px solid var(--bd);border-radius:13px;padding:14px 12px;border-left:4px solid;}
.kb .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);font-weight:600;margin-bottom:4px;}
.kb .val{font-size:21px;font-weight:800;margin-bottom:2px;}
.kb .sub{font-size:11px;color:var(--t3);}
.cg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.cc{background:var(--w);border:1px solid var(--bd);border-radius:15px;padding:16px;cursor:pointer;transition:box-shadow .2s,transform .15s;border-top:4px solid;}
.cc:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-2px);}
.ms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;}
.ms .v{font-size:14px;font-weight:700;text-align:center;}
.ms .l{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);margin-top:2px;font-weight:600;text-align:center;}
.ms div{background:var(--bg);border-radius:9px;padding:8px 6px;}
.pb{height:5px;border-radius:10px;background:var(--bg);}
.pf{height:100%;border-radius:10px;transition:width .4s;}
.card{background:var(--w);border:1px solid var(--bd);border-radius:13px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.ch{padding:12px 16px;font-weight:700;font-size:13px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;background:var(--bg);}
.clc{background:var(--w);border:1px solid var(--bd);border-radius:13px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.clh{padding:13px 15px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--bd);background:var(--bg);}
.clb{padding:12px 15px;display:flex;flex-direction:column;gap:9px;}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0;}
.bdg{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.ar{display:flex;gap:8px;}
.ab{flex:1;padding:8px;border:none;border-radius:9px;font-weight:700;font-size:12px;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;}
.rnb{background:#FFF5F5;border:1.5px solid #FCA5A5;border-radius:13px;padding:13px 15px;margin-bottom:14px;}
.rni{display:flex;align-items:center;gap:10px;background:#FEE2E2;border-radius:9px;padding:9px 11px;margin-top:7px;border:1px solid #FCA5A5;}
.mbg{position:fixed;inset:0;background:rgba(17,24,39,.55);display:flex;align-items:center;justify-content:center;z-index:500;padding:16px;}
.modal{background:var(--w);border-radius:18px;width:100%;max-width:430px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15);}
.mh{padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--bd);background:var(--w);}
.mb{padding:18px;display:flex;flex-direction:column;gap:13px;}
.fl{font-size:11px;color:var(--t2);font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px;}
.inp{border:1.5px solid var(--bd);border-radius:9px;padding:10px 13px;font-size:14px;width:100%;box-sizing:border-box;background:var(--w);color:var(--t);outline:none;}
.inp:focus{border-color:var(--p);}
.sbtn{padding:13px;border:none;border-radius:11px;font-weight:800;font-size:14px;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;width:100%;margin-top:2px;}
.cal{background:var(--w);border:1.5px solid var(--bd);border-radius:13px;padding:12px;box-shadow:0 4px 14px rgba(0,0,0,.09);}
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.calnav button{background:none;border:none;color:var(--t2);cursor:pointer;font-size:18px;font-weight:700;padding:0 5px;}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.calday{text-align:center;padding:6px 2px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--t);}
.calday:hover{background:var(--bg);}
.calday.today{color:var(--p);font-weight:700;border:1px solid var(--p);}
.calday.sel{background:var(--p);color:#fff;font-weight:700;}
.calday.emp{cursor:default;}
.calhead{font-size:10px;color:var(--t3);font-weight:700;text-align:center;padding:3px 0;}
.hi{display:flex;align-items:flex-start;gap:11px;padding:10px 12px;background:var(--bg);border-radius:10px;margin-bottom:7px;}
.hn{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#fff;flex-shrink:0;}
.bk{background:none;border:none;color:var(--t2);cursor:pointer;font-size:13px;font-weight:600;padding:0;margin-bottom:12px;}
.ts{background:var(--w);border:1px solid var(--bd);border-radius:12px;padding:13px 15px;margin-bottom:13px;}
.tr{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:4px;color:var(--t2);}
footer{text-align:center;padding:20px;font-size:10px;color:var(--t3);letter-spacing:.05em;margin-top:8px;}
@media(max-width:640px){.kg{grid-template-columns:repeat(2,1fr);}.cg{grid-template-columns:1fr;}}
</style>
</head>
<body>

<!-- PASSWORD GATE -->
<div id="gate" style="position:fixed;inset:0;background:#F8F9FC;display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;">
  <div style="background:#fff;border-radius:20px;padding:40px 36px;width:100%;max-width:360px;box-shadow:0 8px 40px rgba(0,0,0,0.12);border:1px solid #E5E7EB;text-align:center;">
    <div style="font-size:42px;margin-bottom:12px;">🏋️</div>
    <div style="font-size:22px;font-weight:800;color:#111827;letter-spacing:-0.02em;">FPK <span style="color:#6C63FF;">O'VILLAGE</span></div>
    <div style="font-size:13px;color:#6B7280;margin-top:6px;margin-bottom:28px;font-weight:500;">Accès réservé — Entrez le mot de passe</div>
    <input id="pass-inp" type="password" placeholder="Mot de passe..." style="width:100%;box-sizing:border-box;border:1.5px solid #E5E7EB;border-radius:10px;padding:12px 16px;font-size:15px;outline:none;color:#111827;margin-bottom:10px;text-align:center;letter-spacing:0.1em;">
    <div id="pass-err" style="display:none;font-size:12px;color:#EF4444;font-weight:600;margin-bottom:10px;">❌ Mot de passe incorrect</div>
    <button onclick="checkPass()" style="width:100%;background:#6C63FF;color:#fff;border:none;border-radius:10px;padding:13px;font-weight:800;font-size:15px;cursor:pointer;letter-spacing:0.03em;">ACCÉDER →</button>
    <div style="font-size:10px;color:#9CA3AF;margin-top:20px;letter-spacing:0.05em;">FPK O'VILLAGE © 2025 · Système de gestion interne</div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app-wrap" style="display:none;">

<nav>
  <div class="logo">FPK <span>O'VILLAGE</span></div>
  <button class="nbtn" style="background:var(--p);color:#fff" onclick="openModal('addCoach')">+ Coach</button>
  <div class="mav">AC</div>
</nav>

<div class="tabs">
  <button class="tab active" onclick="goTab('dash')">📊 Dashboard</button>
  <button class="tab" onclick="goTab('coaches')">🏋️ Coaches</button>
  <button class="tab" onclick="goTab('clients')">👥 Clients</button>
  <button class="tab" onclick="goTab('report')">📋 Rapport</button>
</div>

<div id="dash" class="page active"></div>
<div id="coaches" class="page"></div>
<div id="clients" class="page"></div>
<div id="report" class="page"></div>
<div id="coachDetail" class="page"></div>
<div id="modal-root"></div>
</div><!-- end app-wrap -->

<script>
const CARNETS={c1:{name:"1 séance PT",sessions:1,price:300,type:"SOLO"},c2:{name:"10 séances PT",sessions:10,price:2000,type:"SOLO"},c3:{name:"10 séances DUO PT",sessions:10,price:3000,type:"DUO"},c4:{name:"10 séances DUO Premium",sessions:10,price:4500,type:"DUO"},c5:{name:"10 séances Fight",sessions:10,price:2500,type:"FIGHT"},c6:{name:"10 séances Premium",sessions:10,price:3000,type:"PREMIUM"},c7:{name:"10 séances Premium+",sessions:10,price:4000,type:"PREMIUM"},c8:{name:"15 séances PT+1",sessions:16,price:3000,type:"SOLO"},c9:{name:"15 séances DUO Prem.",sessions:15,price:6500,type:"DUO"},c10:{name:"15 séances Premium",sessions:15,price:4500,type:"PREMIUM"},c11:{name:"15 séances DUO",sessions:15,price:4500,type:"DUO"},c12:{name:"20 séances PT+2",sessions:22,price:4000,type:"SOLO"},c13:{name:"20 séances DUO Prem.",sessions:20,price:7500,type:"DUO"},c14:{name:"20 séances Premium",sessions:20,price:6000,type:"PREMIUM"},c15:{name:"20 séances DUO",sessions:20,price:6000,type:"DUO"},c16:{name:"Small Groupe",sessions:1,price:750,type:"GROUPE"}};
const TC={SOLO:"#6C63FF",DUO:"#10B981",FIGHT:"#EF4444",PREMIUM:"#F59E0B",GROUPE:"#3B82F6"};
const FD=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const FM=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const HOURS=Array.from({length:18},(_,i)=>`${(i+6).toString().padStart(2,'0')}:00`);
const CC=["#6C63FF","#10B981","#EF4444","#F59E0B","#3B82F6","#EC4899","#14B8A6"];
const RT=3;
let nid=300,photoData=null,selColor=CC[0],activeCoachId=null;
let coaches=[{id:1,name:"Hassan",av:"HA",color:"#6C63FF",photo:null},{id:2,name:"Sanae",av:"SA",color:"#10B981",photo:null},{id:3,name:"Salah",av:"SL",color:"#EF4444",photo:null},{id:4,name:"Jamal",av:"JA",color:"#F59E0B",photo:null}];
let clients=[],targets={1:50000,2:50000,3:50000,4:50000};
let calDate={},calMonth={};

const t2s=d=>`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
const s2d=s=>{const[dd,mm,yy]=s.split("/");return new Date(+yy,+mm-1,+dd);};
const dname=d=>FD[d.getDay()===0?6:d.getDay()-1];
const today=()=>new Date();
const pct=(a,b)=>b?Math.min(Math.round(a/b*100),100):0;

function cstat(co){
  const cs=clients.filter(c=>c.coachId===co.id);
  const tot=cs.reduce((a,c)=>a+(CARNETS[c.carnetId]?.sessions||0),0);
  const done=cs.reduce((a,c)=>a+c.sessions.length,0);
  const rev=cs.reduce((a,c)=>a+(CARNETS[c.carnetId]?.price||0),0);
  return{...co,cc:cs.length,tot,done,left:tot-done,rev,rate:pct(done,tot),target:targets[co.id]||0,tPct:pct(rev,targets[co.id]||1)};
}
function gstat(){
  const tot=clients.reduce((a,c)=>a+(CARNETS[c.carnetId]?.sessions||0),0);
  const done=clients.reduce((a,c)=>a+c.sessions.length,0);
  const rev=clients.reduce((a,c)=>a+(CARNETS[c.carnetId]?.price||0),0);
  const tT=Object.values(targets).reduce((a,b)=>a+b,0);
  return{n:clients.length,tot,done,left:tot-done,rev,rate:pct(done,tot),tT,tPct:pct(rev,tT)};
}
function renewals(){
  return clients.filter(c=>{const cn=CARNETS[c.carnetId];if(!cn)return false;const l=cn.sessions-c.sessions.length;return l<=RT&&l>0;}).map(c=>{const cn=CARNETS[c.carnetId];return{...c,left:cn.sessions-c.sessions.length,total:cn.sessions};});
}

function ring(p,color,sz=50){
  const r=(sz-8)/2,c2=2*Math.PI*r;
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" style="flex-shrink:0"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#E5E7EB" stroke-width="4"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${color}" stroke-width="4" stroke-dasharray="${c2}" stroke-dashoffset="${c2*(1-p/100)}" stroke-linecap="round" transform="rotate(-90 ${sz/2} ${sz/2})"/><text x="${sz/2}" y="${sz/2+4}" text-anchor="middle" font-size="10" font-weight="700" fill="${color}">${p}%</text></svg>`;
}
function bar(p,color,h=5){return `<div class="pb" style="height:${h}px"><div class="pf" style="width:${p}%;background:${color}"></div></div>`;}
function bdg(t,c){return `<span class="bdg" style="background:${c}18;color:${c};border:1px solid ${c}33">${t}</span>`;}
function avEl(letters,color,size,src){
  const st=`width:${size}px;height:${size}px;border:2px solid ${color}44;background:${color}15;color:${color};font-size:${Math.round(size*.3)}px;`;
  return src?`<div class="av" style="${st}"><img src="${src}" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></div>`:`<div class="av" style="${st}">${letters}</div>`;
}
function kpi(icon,label,value,sub,color){
  return `<div class="kb" style="border-left-color:${color}"><div class="lbl">${icon} ${label}</div><div class="val" style="color:${color}">${value}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
}
function rnBanner(rens){
  if(!rens.length)return'';
  return `<div class="rnb"><div style="font-weight:700;font-size:13px;color:#DC2626">🔔 Renouvellements urgents — ${rens.length} client${rens.length>1?"s":""}</div>
  ${rens.map(r=>{const co=coaches.find(c=>c.id===r.coachId);return`<div class="rni">⚠️<div style="flex:1"><div style="font-weight:700;font-size:13px;color:#991B1B">${r.name}</div><div style="font-size:11px;color:#DC2626;font-weight:600">Coach ${co?.name} · ${r.left} séance${r.left>1?"s":""} restante${r.left>1?"s":""}</div></div><span style="background:#EF4444;border-radius:7px;padding:4px 9px;font-size:11px;color:#fff;font-weight:700">RENOUVELER</span></div>`;}).join('')}</div>`;
}

// CALENDAR
function calHTML(id,value,accent){
  const d=value?s2d(value):today();
  if(!calMonth[id])calMonth[id]={y:d.getFullYear(),m:d.getMonth()};
  const{y,m}=calMonth[id];
  const first=new Date(y,m,1).getDay(),offset=first===0?6:first-1;
  const days=new Date(y,m+1,0).getDate(),td=today();
  let cells='';
  for(let i=0;i<offset;i++)cells+=`<div class="calday emp"></div>`;
  for(let d2=1;d2<=days;d2++){
    const sel=value&&(()=>{const v=s2d(value);return v.getDate()===d2&&v.getMonth()===m&&v.getFullYear()===y;})();
    const isT=td.getDate()===d2&&td.getMonth()===m&&td.getFullYear()===y;
    cells+=`<div class="calday${sel?" sel":""}${isT&&!sel?" today":""}" onclick="pickDate('${id}','${d2}/${m+1}/${y}','${accent}')" style="${sel?`background:${accent};`:''}">${d2}</div>`;
  }
  return `<div class="cal" style="border-color:${accent}55">
    <div class="calnav"><button onclick="calNav('${id}',-1)">‹</button><span style="font-weight:700;font-size:13px">${FM[m]} ${y}</span><button onclick="calNav('${id}',+1)">›</button></div>
    <div class="calgrid">${["L","M","M","J","V","S","D"].map(d=>`<div class="calhead">${d}</div>`).join('')}${cells}</div>
  </div>`;
}
function calNav(id,dir){
  const c=calMonth[id];let{y,m}=c;m+=dir;if(m<0){m=11;y--;}else if(m>11){m=0;y++;}calMonth[id]={y,m};
  const el=document.getElementById(`cw-${id}`);if(el)el.innerHTML=calHTML(id,calDate[id]||'',el.dataset.a||"#6C63FF");
}
function pickDate(id,raw,accent){
  const[dd,mm,yy]=raw.split("/");const d=new Date(+yy,+mm-1,+dd);
  const str=t2s(d);calDate[id]=str;
  const inp=document.getElementById(`di-${id}`);if(inp)inp.textContent=str;
  const dayI=document.getElementById(`day-${id}`);if(dayI)dayI.value=dname(d);
  const el=document.getElementById(`cw-${id}`);if(el)el.innerHTML=calHTML(id,str,accent);
}
function toggleCal(id){
  const el=document.getElementById(`cw-${id}`);if(!el)return;
  const h=el.style.display==='none';el.style.display=h?'block':'none';
  if(h)el.innerHTML=calHTML(id,calDate[id]||'',el.dataset.a||"#6C63FF");
}
function dateField(id,label,value,accent){
  calDate[id]=value||t2s(today());calMonth[id]=null;
  return `<div><div class="fl">${label}</div>
    <div onclick="toggleCal('${id}')" style="border:1.5px solid ${accent}55;border-radius:9px;padding:10px 13px;font-size:14px;background:#fff;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:500">
      <span id="di-${id}">${calDate[id]}</span><span>📅</span>
    </div>
    <div id="cw-${id}" data-a="${accent}" style="margin-top:6px;display:none"></div>
  </div>`;
}

// MODALS
function openModal(type,coachId,clientId){
  const root=document.getElementById('modal-root');
  const co=coaches.find(c=>c.id===coachId)||coaches[0];
  const tc=co?co.color:"#6C63FF";
  let body='',headTxt='',headColor=tc;

  if(type==='addClient'){
    headTxt=`Nouveau client — ${co.name}`;
    const td=t2s(today());
    body=`<div style="display:flex;align-items:center;gap:13px">
      <div id="pp" onclick="document.getElementById('pi').click()" style="width:70px;height:70px;border-radius:50%;border:2px dashed ${tc}55;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:${tc}0d;flex-shrink:0">
        <div style="font-size:20px;color:${tc};font-weight:700">+</div><div style="font-size:10px;color:${tc};font-weight:600">Photo</div>
      </div>
      <input type="file" id="pi" accept="image/*" style="display:none" onchange="prevPhoto()">
      <div style="flex:1"><div class="fl">Nom complet *</div><input class="inp" id="nc-n" placeholder="Prénom Nom" style="border-color:${tc}55"></div>
    </div>
    <div><div class="fl">Carnet / Programme</div>
      <select class="inp" id="nc-c" onchange="upCarnet(this.value)">
        ${Object.entries(CARNETS).map(([k,v])=>`<option value="${k}">${v.name} — ${v.price} MAD</option>`).join('')}
      </select>
      <div id="cp" style="margin-top:6px;padding:9px 12px;border-radius:9px;background:${tc}0d;border:1.5px solid ${tc}33;display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-weight:700;color:${tc};font-size:13px">10 séances PT</div><div style="font-size:11px;color:var(--t3);margin-top:1px">10 séances · SOLO</div></div>
        <div style="font-size:17px;font-weight:800">2 000 <span style="font-size:11px;font-weight:600">MAD</span></div>
      </div>
    </div>
    ${dateField('nc-p','Date de paiement',td,'#F59E0B')}
    <div style="font-size:11px;color:#D97706;font-weight:600;margin-top:-6px">💳 Paiement enregistré le <span id="pd">${td}</span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><div class="fl">Jour habituel</div><select class="inp" id="nc-d">${FD.map(d=>`<option>${d}</option>`).join('')}</select></div>
      <div><div class="fl">Heure</div><select class="inp" id="nc-h">${HOURS.map(h=>`<option>${h}</option>`).join('')}</select></div>
    </div>
    <div><div class="fl">Notes</div><input class="inp" id="nc-nt" placeholder="Objectifs, remarques..."></div>
    <button class="sbtn" style="background:${tc};color:#fff" onclick="submitClient(${coachId})">Ajouter le client</button>`;
  }

  else if(type==='addSession'){

    <div id="cprev" style="display:flex;align-items:center;gap:11px;padding:10px 13px;background:#6C63FF0d;border:1px solid #6C63FF33;border-radius:11px">
      <div id="cprev-av" style="width:42px;height:42px;border-radius:50%;background:#6C63FF33;border:2px solid #6C63FF55;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#6C63FF;overflow:hidden;flex-shrink:0">?</div>
      <div><div id="cprev-name" style="font-weight:700;font-size:14px">Coach ...</div><div style="font-size:11px;color:var(--t3);margin-top:1px">Aperçu</div></div>
    </div>
    <button class="sbtn" style="background:#6C63FF;color:#fff" onclick="submitCoach()">Ajouter le coach</button>`;

  else if(type==='setTarget'){

    <div style="background:${tc}0d;border:1.5px solid ${tc}33;border-radius:9px;padding:10px 13px;font-size:13px;color:${tc};font-weight:600">🎯 Objectif mensuel pour Coach ${co.name}</div>
    <button class="sbtn" style="background:${tc};color:#fff" onclick="submitTarget(${coachId})">Enregistrer</button>`;

function closeModal(){document.getElementById('modal-root').innerHTML='';}

function upCarnet(id){
  const cn=CARNETS[id];if(!cn)return;const c=TC[cn.type];
  const el=document.getElementById('cp');
  if(el)el.innerHTML=`<div><div style="font-weight:700;color:${c};font-size:13px">${cn.name}</div><div style="font-size:11px;color:var(--t3);margin-top:1px">${cn.sessions} séances · ${cn.type}</div></div><div style="font-size:17px;font-weight:800">${cn.price.toLocaleString()} <span style="font-size:11px;font-weight:600">MAD</span></div>`;
}
function selC(c){
  selColor=c;
  document.querySelectorAll('[id^="cc-"]').forEach(d=>d.style.border='3px solid transparent');
  const el=document.getElementById('cc-'+c.replace('#',''));if(el)el.style.border='3px solid #111';
  const av=document.getElementById('cprev-av');if(av){av.style.background=c+'33';av.style.borderColor=c+'55';av.style.color=c;}
  const prev=document.getElementById('cprev');if(prev)prev.style.background=c+'0d';
}
function upCoachPrev(){
  const n=document.getElementById('nc2-n')?.value||'';
  const av=document.getElementById('cprev-av');const nm=document.getElementById('cprev-name');
  if(av)av.textContent=n?n.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase():"?";
  if(nm)nm.textContent='Coach '+(n||'...');
}
let coachPhotoData=null;
function prevPhoto(){const f=document.getElementById('pi')?.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{photoData=ev.target.result;const p=document.getElementById('pp');if(p)p.innerHTML=`<img src="${photoData}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;};r.readAsDataURL(f);}
function prevCoachPhoto(){const f=document.getElementById('pi2')?.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{coachPhotoData=ev.target.result;const p=document.getElementById('cp2');if(p)p.innerHTML=`<img src="${coachPhotoData}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;const av=document.getElementById('cprev-av');if(av)av.innerHTML=`<img src="${coachPhotoData}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;};r.readAsDataURL(f);}

function submitClient(coachId){
  const name=document.getElementById('nc-n')?.value.trim();if(!name){alert('Nom requis');return;}
  clients.push({id:nid++,coachId,name,carnetId:document.getElementById('nc-c')?.value||'c2',day:document.getElementById('nc-d')?.value||'Lundi',hour:document.getElementById('nc-h')?.value||'09:00',notes:document.getElementById('nc-nt')?.value||'',payDate:calDate['nc-p']||t2s(today()),photo:photoData,sessions:[]});
  photoData=null;closeModal();renderDetail(coachId);renderDash();
}
function submitSession(coachId,clientId){
  const date=calDate['ns-d']||t2s(today());
  const dayStr=document.getElementById('day-ns-d')?.value||dname(s2d(date));
  const cl=clients.find(c=>c.id===clientId);if(!cl)return;
  const cn=CARNETS[cl.carnetId];if(cn&&cl.sessions.length>=cn.sessions)return;
  cl.sessions.push({id:nid++,date,day:dayStr,hour:document.getElementById('ns-h')?.value||'09:00',notes:document.getElementById('ns-n')?.value||''});
  closeModal();renderDetail(coachId);renderDash();
}
function submitCoach(){
  const name=document.getElementById('nc2-n')?.value.trim();if(!name)return;
  const id=nid++;const av=name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  coaches.push({id,name,av,color:selColor,photo:coachPhotoData});coachPhotoData=null;
  targets[id]=50000;closeModal();renderDash();renderCoaches();
}
function submitTarget(coachId){
  targets[coachId]=Number(document.getElementById('tv')?.value||0);
  closeModal();renderDash();if(activeCoachId===coachId)renderDetail(coachId);
}
function updNote(id,val){const cl=clients.find(c=>c.id===id);if(cl)cl.notes=val;}
function delClient(id){if(!confirm('Supprimer ce client ?'))return;clients=clients.filter(c=>c.id!==id);renderDetail(activeCoachId);renderDash();}

    html+=`<tr style="border-bottom:1px solid var(--bd)">
      <td style="padding:10px 12px;font-weight:700;color:${co.color}">● ${co.name}</td>
      <td style="padding:10px 12px;font-weight:700">${s.cc}</td>
      <td style="padding:10px 12px;font-weight:700;color:#10B981">${s.done} / ${s.tot}</td>
      <td style="padding:10px 12px;font-weight:700;color:#EF4444">${s.left}</td>
      <td style="padding:10px 12px">${bar(s.rate,s.rate>=70?"#10B981":s.rate>=40?"#F59E0B":"#EF4444",6)}<span style="font-size:12px;font-weight:700;margin-left:5px;color:${s.rate>=70?"#10B981":s.rate>=40?"#F59E0B":"#EF4444"}">${s.rate}%</span></td>
      <td style="padding:10px 12px;font-weight:700;color:#3B82F6">${s.rev.toLocaleString()} MAD</td>
      <td style="padding:10px 12px;color:var(--t2)">${s.target.toLocaleString()} MAD</td>
      <td style="padding:10px 12px">${bar(s.tPct,s.tPct>=100?"#10B981":s.tPct>=60?"#F59E0B":co.color,6)}<span style="font-size:12px;font-weight:700;margin-left:5px;color:${co.color}">${s.tPct}%</span></td>
    </tr>`;
  });
  html+=`</tbody></table></div></div>`;
  document.getElementById('report').innerHTML=html;
}

function goTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>{const ts=['dash','coaches','clients','report'];t.classList.toggle('active',ts[i]===tab);});
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  if(tab==='dash')renderDash();
  else if(tab==='coaches')renderCoaches();
  else if(tab==='clients')renderClients();
  else if(tab==='report')renderReport();
}
function goDetail(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('coachDetail').classList.add('active');
  renderDetail(id);
}

// ── PASSWORD GATE ──
const PASS = "OvillagePT"; // ← change this to your password

function checkPass() {
  const v = document.getElementById('pass-inp').value;
  if(v === PASS) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app-wrap').style.display = 'block';
    localStorage.setItem('fpk_auth', PASS);
  } else {
    const err = document.getElementById('pass-err');
    err.style.display = 'block';
    document.getElementById('pass-inp').style.borderColor = '#EF4444';
    setTimeout(()=>{ err.style.display='none'; document.getElementById('pass-inp').style.borderColor='#E5E7EB'; }, 2500);
  }
}

// Check if already authenticated
if(localStorage.getItem('fpk_auth') === PASS) {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app-wrap').style.display = 'block';
}

document.getElementById('pass-inp').addEventListener('keydown', e => {
  if(e.key === 'Enter') checkPass();
});

renderDash();
</script>
